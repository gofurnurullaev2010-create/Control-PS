<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Segoe UI, Arial, sans-serif;
        }
        .logo {
            position: absolute;
            inset: 0;
            background: #000 url('lock_screen_bg.png') center center / cover no-repeat;
        }
        .clock-wrap {
            position: absolute;
            top: 18px;
            right: 22px;
            z-index: 2;
            text-align: right;
        }
        .clock {
            font-family: Consolas, "Courier New", monospace;
            font-size: clamp(28px, 5.5vw, 52px);
            font-weight: 800;
            color: #FFB020;
            text-shadow: 0 0 18px rgba(255, 140, 0, 0.65), 0 4px 16px #000;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
        }
        .tz {
            margin-top: 4px;
            font-size: clamp(12px, 1.8vw, 16px);
            font-weight: 700;
            color: rgba(255, 176, 32, 0.85);
            letter-spacing: 0.12em;
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <div class="clock-wrap">
        <div class="clock" id="clock">00:00:00</div>
        <div class="tz">O'ZBEKISTON</div>
    </div>
    <script>
        var fmt = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Tashkent',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        function updateClock() {
            document.getElementById('clock').innerText = fmt.format(new Date());
        }
        setInterval(updateClock, 1000);
        updateClock();
        document.addEventListener('keydown', function (e) { e.preventDefault(); e.stopPropagation(); });
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    </script>
</body>
</html>
